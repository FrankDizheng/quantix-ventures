# Default paths (relative to repo root)
data_dir: data

# Dune Analytics — on-chain SQL (API key via env, never in this file)
# Set DUNE_API_KEY in crypto-quant/.env (see .env.example, docs/DUNE.md)
dune:
  api_key_env: DUNE_API_KEY
  api_base: https://api.dune.com/api/v1
  mcp_url: https://api.dune.com/mcp/v1
  default_chain: ethereum
  sql_performance: small
  poll_interval_sec: 2
  poll_timeout_sec: 300

# CCXT live / incremental historical fetch
ccxt:
  exchange: binanceusdm
  rate_limit_ms: 200
  default_timeframe: 1h
  default_symbols:
    - BTC/USDT:USDT
    - ETH/USDT:USDT

# Binance public archive (data.binance.vision) — no API key
binance_vision:
  market: spot
  data_type: klines
  interval: 1h
  symbols:
    - BTCUSDT
    - ETHUSDT

# CoinGecko public API (free tier, no key)
coingecko:
  vs_currency: usd
  coin_ids:
    - bitcoin
    - ethereum

# Small-cap perpetual scan (see: cq scan-perps)
scan:
  exchanges:
    - binanceusdm
    - bybit
    - okx
    - gate
    - bitget
  min_quote_volume_usd: 500000
  top_n: 20

# Strategy: "Ignition" — small-cap momentum burst (exchange OHLCV only)
strategy:
  name: ignition
  timeframe: 1h
  symbol: PEPE/USDT:USDT
  exchange: okx
  lookback_days: 90
  # --- v3: Donchian breakout entry + ATR stop + trailing exit ---
  params:
    breakout_hours: 36          # tuned: shorter Donchian catches moves earlier
    vol_ma_hours: 20
    vol_mult: 1.3               # tuned: slightly looser volume confirm
    htf_trend_hours: 96         # 4d SMA, big-picture filter (0 to disable)
    vwap_hours: 168             # cost-zone proxy: 7d VWAP
    max_dist_to_cost_pct: 10.0  # tuned: tighter — don't chase extended
    cooldown_bars: 12
    # --- exits ---
    atr_hours: 24
    atr_stop_mult: 3.5          # tuned: wider initial stop (fewer whipsaws)
    trail_pct: 20.0             # Gate-1 honest a6: looser trail captures more
                                #  of the move on coins that actually rip
    max_hold_hours: 48          # Gate-1 honest a6: shorter than 7d — cuts
                                #  stale losers, recycles capital faster
    # Gate-1 path-A toggles (kept off in default, override per-run if useful)
    require_btc_uptrend: false  # tested: HURT edge on 30d OOS (a1)
    max_dist_to_breakout_pct: 0.0  # tested: no effect at 3% (a2)
  backtest_honest:              # used by cq backtest-honest defaults
    initial_capital: 10000
    fee_rate: 0.0004            # 0.04% per side (taker)
    slippage_pct: 0.15          # 15 bps per side — realistic for small-caps
    funding_per_8h_pct: 0.03    # ~33%/yr long carry in typical bull
    position_fraction: 0.25     # cap single-trade exposure at 25% of equity
  # FundingCarry v1 — structural edge: SHORT perp when funding > X (longs pay).
  # Naked short version (no spot hedge). Time-stop + ATR stop cap downside.
  funding_carry:
    params:
      entry_funding_threshold_pct: 0.01   # short when funding > +0.01%/8h
      exit_funding_threshold_pct: 0.002    # exit when |funding| < 0.002%/8h
      symmetric: true                       # also long when funding < -0.01%
      cooldown_bars: 8
      atr_hours: 24
      atr_stop_mult: 4.0                   # wide stop — carry needs room
      trail_pct: 0.0
      take_profit_pct: 0.0
      max_hold_hours: 72
  # MeanReversion v1 — opposite hypothesis: SHORT small-cap pumps.
  # Exit uses both ATR/trail stops AND a take-profit (unlike trend).
  mean_reversion:
    params:
      pump_lookback_hours: 24
      pump_min_ret_pct: 25.0
      vwap_hours: 168
      extension_pct: 15.0
      vol_ma_hours: 20
      vol_mult: 1.5
      rsi_hours: 14
      rsi_threshold: 75.0
      cooldown_bars: 12
      atr_hours: 24
      atr_stop_mult: 2.0
      trail_pct: 8.0
      take_profit_pct: 8.0
      max_hold_hours: 48
  # Dune on-chain filter (requires token_map.yaml + DUNE_API_KEY)
  dune:
    enabled: true
    lookback_days: 90
    rolling_days: 7
    max_rolling_net_inflow_usd: 2000000   # skip if 7d net CEX inflow above this
    require_net_outflow: false            # true = only when net leaving exchanges
    skip_if_missing: true                  # no token_map entry -> ignore Dune filter
  backtest:
    initial_capital: 10000
    fee_rate: 0.0004            # 0.04% per side (rough perp taker)
    slippage_pct: 0.05          # 5 bps per side
    position_fraction: 1.0

# Local data cache — backtests read data/ first; network only when missing/stale
sync:
  exchange: okx
  timeframe: 1h
  lookback_days: 90
  dune_lookback_days: 90
  max_stale_hours: 24          # auto-refresh if last bar older than this

# Candidate pool (cq build-pool)
pool:
  exchange: okx
  timeframe: 1h
  ohlcv_days: 21
  min_quote_volume_usd: 1000000
  max_quote_volume_usd: 80000000
  max_candidates: 30       # before cost-zone ranking
  final_top: 10            # after ranking
  cost_zone:
    vwap_hours: 168
    box_hours: 168
    box_k: 2.0
    extended_pct: 15.0
    accumulation_max_ret: 4.0
    accumulation_max_dist: 3.0
