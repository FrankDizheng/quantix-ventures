[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crypto-quant"
version = "0.1.0"
description = "Crypto quantitative trading toolkit with open-source market data extraction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "crypto-quant" }]
dependencies = [
    "ccxt>=4.4.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
cq = "crypto_quant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_quant"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
